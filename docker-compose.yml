services:
  anaxa:
    build:
      context: .
      dockerfile: Dockerfile
    image: anaxa:local
    ports:
      - "30720:30720"
    volumes:
      - anaxa-data:/data/anaxa
    command:
      - --host=0.0.0.0
      - --port=30720
      - --data-dir=/data/anaxa
      - --allow-open-access=true

volumes:
  anaxa-data:
