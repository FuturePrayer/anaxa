name: Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          set -euo pipefail

          project_version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          tag="${project_version}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "Triggered tag '${GITHUB_REF_NAME}' does not match parent pom version '${tag}'."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git fetch --force origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"

          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag '${tag}' does not exist yet."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          tag_commit="$(git rev-list -n 1 "refs/tags/${tag}")"
          release_branch=""
          for branch in main master; do
            if git rev-parse -q --verify "refs/remotes/origin/${branch}" >/dev/null && git merge-base --is-ancestor "${tag_commit}" "refs/remotes/origin/${branch}"; then
              release_branch="${branch}"
              break
            fi
          done

          if [[ -z "${release_branch}" ]]; then
            echo "Tag '${tag}' is not contained in origin/main or origin/master yet."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          prerelease=false
          lower_tag="${tag,,}"
          if [[ "${lower_tag}" =~ snapshot|alpha|beta|rc|milestone|preview|pre|dev|nightly ]]; then
            prerelease=true
          fi
          release_type="stable"
          if [[ "${prerelease}" == "true" ]]; then
            release_type="pre-release"
          fi

          jdk_version="$(java -version 2>&1 | awk 'NR == 1 { print }')"

          {
            echo "publish=true"
            echo "version=${project_version}"
            echo "tag=${tag}"
            echo "release_branch=${release_branch}"
            echo "prerelease=${prerelease}"
            echo "release_type=${release_type}"
            echo "jdk_version=${jdk_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build release artifacts
        if: steps.release.outputs.publish == 'true'
        run: mvn --batch-mode clean package

      - name: Stage release artifacts
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          mkdir -p release-artifacts
          cp "anaxa-server/target/anaxa-server-${version}.jar" "release-artifacts/anaxa-server-${version}.jar"
          cp "anaxa-benchmark/target/anaxa-benchmark-${version}.jar" "release-artifacts/anaxa-benchmark-${version}.jar"
          cp "anaxa-sdk/target/anaxa-sdk-${version}.jar" "release-artifacts/anaxa-sdk-${version}.jar"
          sha256sum release-artifacts/*.jar > "release-artifacts/anaxa-${version}-checksums.sha256"

      - name: Write release notes
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## AnaxaDB ${{ steps.release.outputs.version }}

          Release branch: `${{ steps.release.outputs.release_branch }}`

          Release type: `${{ steps.release.outputs.release_type }}`

          Build JDK: `${{ steps.release.outputs.jdk_version }}`

          Published artifacts:
          - `anaxa-server-${{ steps.release.outputs.version }}.jar`
          - `anaxa-benchmark-${{ steps.release.outputs.version }}.jar`
          - `anaxa-sdk-${{ steps.release.outputs.version }}.jar`
          - `anaxa-${{ steps.release.outputs.version }}-checksums.sha256`
          EOF

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: AnaxaDB ${{ steps.release.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ steps.release.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            release-artifacts/anaxa-server-${{ steps.release.outputs.version }}.jar
            release-artifacts/anaxa-benchmark-${{ steps.release.outputs.version }}.jar
            release-artifacts/anaxa-sdk-${{ steps.release.outputs.version }}.jar
            release-artifacts/anaxa-${{ steps.release.outputs.version }}-checksums.sha256
