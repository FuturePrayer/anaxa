name: Docker Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-release:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    env:
      PRIVATE_REGISTRY: ${{ secrets.PRIVATE_REGISTRY }}
      PRIVATE_REGISTRY_USERNAME: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
      PRIVATE_REGISTRY_PASSWORD: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
      PRIVATE_REGISTRY_NAMESPACE: ${{ secrets.PRIVATE_REGISTRY_NAMESPACE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          set -euo pipefail

          project_version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          tag="${project_version}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "Triggered tag '${GITHUB_REF_NAME}' does not match parent pom version '${tag}'."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git fetch --force origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"

          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag '${tag}' does not exist yet."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          tag_commit="$(git rev-list -n 1 "refs/tags/${tag}")"
          release_branch=""
          for branch in main master; do
            if git rev-parse -q --verify "refs/remotes/origin/${branch}" >/dev/null && git merge-base --is-ancestor "${tag_commit}" "refs/remotes/origin/${branch}"; then
              release_branch="${branch}"
              break
            fi
          done

          if [[ -z "${release_branch}" ]]; then
            echo "Tag '${tag}' is not contained in origin/main or origin/master yet."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          lower_tag="${tag,,}"
          if [[ "${lower_tag}" =~ snapshot|alpha|beta|rc|milestone|preview|pre|dev|nightly ]]; then
            echo "Version '${tag}' is not stable. Docker images are only published for stable releases."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          ghcr_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_tags="$(printf '%s\n%s' "${ghcr_image}:${project_version}" "${ghcr_image}:latest")"

          private_registry="$(echo "${PRIVATE_REGISTRY}" | xargs)"
          private_namespace="$(echo "${PRIVATE_REGISTRY_NAMESPACE}" | xargs)"
          private_username="$(echo "${PRIVATE_REGISTRY_USERNAME}" | xargs)"
          private_password="$(echo "${PRIVATE_REGISTRY_PASSWORD}" | xargs)"
          private_ready="false"
          if [[ -n "${private_registry}" && -n "${private_namespace}" && -n "${private_username}" && -n "${private_password}" ]]; then
            private_ready="true"
            private_registry="${private_registry%/}"
            private_namespace="${private_namespace#/}"
            private_namespace="${private_namespace%/}"
            private_image="${private_registry}/${private_namespace}/anaxa"
            image_tags="$(printf '%s\n%s\n%s' "${image_tags}" "${private_image}:${project_version}" "${private_image}:latest")"
          else
            echo "Private registry secrets are incomplete; only GHCR image will be published."
          fi

          {
            echo "publish=true"
            echo "version=${project_version}"
            echo "tag=${tag}"
            echo "ghcr_image=${ghcr_image}"
            echo "private_registry=${private_registry}"
            echo "private_ready=${private_ready}"
            echo "image_tags<<EOF"
            echo "${image_tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: steps.release.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to private registry
        if: steps.release.outputs.publish == 'true' && steps.release.outputs.private_ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.release.outputs.private_registry }}
          username: ${{ env.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ env.PRIVATE_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          outputs: type=image,push=true,oci-mediatypes=false
          tags: ${{ steps.release.outputs.image_tags }}
          labels: |
            org.opencontainers.image.title=AnaxaDB
            org.opencontainers.image.description=Standalone vector database built on modern Java
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
